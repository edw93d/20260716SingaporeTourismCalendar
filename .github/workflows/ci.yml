# The merge gate. Every guard this repo relies on — the banned bare "event"
# term, the zero-`process.env` rule, ADR-0010's single client construction site,
# the AGPLv3 licence, and the structural properties `tests/workflow.test.ts`
# holds about the daily pipeline — is enforced *by a test*, and a test enforces
# nothing on a change nobody ran it against. Until this file existed, nothing
# ran on a pull request at all (#45): the suite was only ever as good as whoever
# remembered to run it locally.
#
# Zero credentials, like `daily.yml`. This job reads the code and reports a
# status; `tests/workflow.test.ts` scans every workflow — this one included — for
# secret references and keepalives, and this file is meant to pass that, not be
# exempted from it.
name: CI

on:
  # The gate proper: every pull request, whatever its target.
  pull_request:
  # And on the trunk itself, so a merge is checked even when it lands without a
  # PR (a direct push, an admin override). The check that guards `main` should
  # also run *on* `main`.
  push:
    branches: [main]

# **Cancel-in-progress is correct here, unlike the daily pipeline.** A check run
# writes nothing — no store, no push, no side effect to tear — so a superseded
# run has nothing worth finishing. Pushing twice to a branch should abandon the
# stale check and grade the tip, not queue behind a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Read the code, report a status. Nothing here writes.
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # **A real ephemeral Postgres, because the store's traps live in real SQL**
    # (ADR-0025). The upsert that must not touch a moderation column, the
    # `ON CONFLICT` sequence bump, the migration column-copy — a fake would be
    # exactly where those hide. It is the storage-layer equal of the fake browser
    # below: spun up per run, thrown away with it, and holding nothing that
    # outlives the job.
    #
    # **Still zero *stored* credentials.** `POSTGRES_PASSWORD` here is a literal
    # for a throwaway database on `localhost` that lives and dies with this
    # runner — not a `secrets.*` reference, which `tests/workflow.test.ts` still
    # forbids for anything but `GITHUB_TOKEN`. The one real credential v2 holds is
    # the *production* connection string, injected into `main.ts` at run time and
    # named nowhere in this file.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgcal_test
        ports:
          - 5432:5432
        # Gate the steps on readiness: without the health check the first query
        # can race the container's startup and fail a perfectly good change.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Node 22, matching `daily.yml`. A version skew is how a suite goes green
      # in CI and breaks in production for a reason that has nothing to do with
      # the change.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # No `playwright install` here, deliberately. The suite drives the MBCCS
      # source through a fake browser (`tests/mbccs.test.ts`), so it
      # needs no real Chromium — only the daily pipeline, which launches a live
      # session, does.
      - name: Typecheck
        run: npm run typecheck

      # `TEST_DATABASE_URL` points the store tests at the service above. The
      # tests carve a fresh schema per test off this connection and drop it after,
      # so nothing leaks between them.
      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sgcal_test
