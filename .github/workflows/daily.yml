# The daily run — **re-enabled for v2** (ADR-0028, #159).
#
# v1 retired this workflow because it scraped, committed the harvest back to the
# repository and published it, and ADR-0026 §4 rules that the repository publishes
# **the code and not the harvest** (#147). v2 removes the reason the schedule was
# dangerous: the run is now a **pure writer to a hosted Postgres store**
# (ADR-0025) — there is no commit-back and no Pages publish here, so a scheduled
# run puts nothing scraped into the public repository. The server serves the
# calendar live from the store (ADR-0025 §4); this job only refreshes it.
#
# What was paid for over #45/#46/#60 and kept: the concurrency group and its
# `cancel-in-progress: false`, now serializing the on-demand path too (ADR-0028
# §4). What is gone with the commit-back: the full-history checkout, the push
# retry, and every Pages step.
#
# **One credential, injected, never stored in the tree.** The run holds the
# Postgres connection string as `secrets.DATABASE_URL` (ADR-0025 spends v1's
# zero-credentials property) and authenticates `gh` with the run-scoped
# `GITHUB_TOKEN`. `tests/workflow.test.ts` allows exactly those two and fails a
# third.
name: Daily pipeline

on:
  # The nightly cadence (ADR-0028 §1), off the top of the hour: GitHub drops
  # scheduled runs under load, and load concentrates on the minute everybody
  # picked, so :37 (19:37 UTC = 03:37 SGT). `tests/workflow.test.ts` holds that a
  # revived schedule stays daily and off-hour, and keeps the freshness watcher's
  # offset arithmetic (ADR-0013) valid.
  schedule:
    - cron: "37 19 * * *"

  # On demand, with a *"which source?"* input (ADR-0028 §3). Empty runs the whole
  # registry — the same as the nightly — and a source id runs **only** that one,
  # the founding complaint's direct fix. The input reaches the pipeline as the
  # `SOURCE` environment variable on the run step below.
  workflow_dispatch:
    inputs:
      source:
        description: "Which source? Leave empty to run all; a source id runs only that one."
        required: false
        default: ""

# **On-demand and nightly runs queue; they never overlap** (ADR-0028 §4). Two
# concurrent scrapes would let ADR-0007's net-drop detection read each other's
# partial writes and raise a false breakage signal. Queued rather than cancelled:
# a cancelled run may already have upserted, and killing it between the
# transaction and its completion is the one way to lose a scrape actually made.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  # Read the code to run it. Nothing is written back — the store is Postgres, not
  # a committed blob, so this job needs no `contents: write` (that was v1's
  # commit-back, removed).
  contents: read
  # Raise and auto-close the operator's breakage issues (ADR-0007, #41). The
  # pipeline shells out to `gh`, which authenticates with the run-scoped
  # `GITHUB_TOKEN`.
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # MBCCS is the one source that needs a real browser (ADR-0005, Amendment 2):
      # its schedule is a hydrated Next.js app with the stable ids only in React
      # state. Chromium and its OS libraries are installed here so the headless
      # session `src/pipeline/browser.ts` launches has a browser to drive. The run
      # itself launches Chromium only when a selected source declares
      # `needsBrowser` (ADR-0028 §6); installing it here is cheap insurance so a
      # full nightly run — which always includes MBCCS — never lacks it. No
      # credential is involved: the page authenticates itself and we only read
      # what it has already loaded (#37).
      - name: Install the headless browser
        run: npx playwright install --with-deps chromium

      # Scrapes the selected sources and folds what it saw into the Postgres store
      # (ADR-0025). A pure writer — it emits no feeds and no committed artefact
      # (ADR-0028 §9). A source that cannot be read is reported and does not fail
      # the run — see the note in `src/main.ts`. The same process then raises or
      # clears the operator's breakage issues (ADR-0007, #41) via `gh`.
      #
      # `DATABASE_URL` is the injected store connection (ADR-0025); `GITHUB_TOKEN`
      # is the run-scoped token `gh` reads; `SOURCE` is the on-demand input, empty
      # on a scheduled run so the whole registry runs.
      - name: Run the pipeline
        run: npm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source }}
